name: Build tcc for ARMv7 musl softfloat

on:
  push:
    branches: [ mob ]
  workflow_dispatch:

jobs:
  build-armv7-musl-softfloat:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tcc
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            qemu-user-static

      - name: Build tcc (armv7, musl-compatible, softfloat, static)
        env:
          CC: arm-linux-gnueabi-gcc
          # 软浮点 + 针对 Cortex-A9 优化；不启用 VFP（硬件缺失）
          CFLAGS: "-O2 -march=armv7-a -mcpu=cortex-a9 -mfloat-abi=soft -msoft-float -static"
          LDFLAGS: "-static"
        run: |
          ./configure \
            --prefix=/usr/local \
            --cross-prefix=arm-linux-gnueabi- \
            --cpu=armv7a \
            --disable-rpath
          make -j"$(nproc)"
          arm-linux-gnueabi-strip -s tcc

      - name: Verify binary ABI (no VFP, softfloat, static)
        run: |
          set -e
          echo "=== file ==="
          file tcc
          echo "=== NEEDED libs (should be empty for static) ==="
          arm-linux-gnueabi-readelf -d tcc | grep NEEDED || echo "none (statically linked)"
          echo "=== Tag_ABI_VFP_args (must be 0 / soft) ==="
          arm-linux-gnueabi-readelf -A tcc | grep -iE "VFP|FP_arch" || echo "no VFP tag"

      - name: Smoke test under QEMU (compile + run a hello program)
        run: |
          cat > hello.c << 'EOF'
          #include <stdio.h>
          int main(void) {
              printf("hello from tcc on ARMv7 softfloat\n");
              return 0;
          }
          EOF
          # 用刚编出的 tcc（经 qemu-arm 模拟运行）编译 hello.c
          qemu-arm-static -L /usr/arm-linux-gnueabi ./tcc hello.c -o hello -static
          file hello
          qemu-arm-static ./hello

      - name: Upload tcc binary
        uses: actions/upload-artifact@v4
        with:
          name: tcc-armv7-musl-softfloat
          path: tcc
          retention-days: 90
